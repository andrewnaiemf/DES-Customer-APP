name: app
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.9+51

environment:
  sdk: '>=3.1.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.2
  bloc: ^8.1.1
  provider: ^6.1.1
  intl: ^0.20.2
  flutter_svg: ^2.2.4
#  flutter_speed_dial: ^6.2.0
#  carousel_slider: ^4.1.1
  dio: ^5.0.2
  local_auth: ^2.1.7
  flutter_secure_storage: ^8.0.0
  firebase_core: ^3.0.0
#  firebase_storage: ^11.0.6
#  firebase_auth: ^5.0.0
  url_launcher: ^6.1.7
  # 🔗 Deep Links (App Links / Universal Links) + Share
  app_links: ^6.3.2
  share_plus: ^10.1.4
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  file_picker: ^8.1.7
  path_provider: ^2.0.12
  permission_handler: ^11.3.0
  image_picker: ^0.8.6
  firebase_messaging: ^15.0.0
  easy_localization: ^3.0.8
  shared_preferences: ^2.1.1
  string_validator: ^1.0.0
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.13.1
#  flutter_advanced_networkimage_2: ^2.0.1
#  cloud_firestore: ^5.0.0
  pin_code_fields: ^8.0.1
  auto_size_text: ^3.0.0
#  loading_animation_widget: ^1.2.0+4
#  fl_chart: ^0.64.0
  gif_view: ^1.0.3
  pdf: ^3.10.7
  open_file: ^3.5.11
  fluttertoast: ^9.0.0
  #  device_info:
#  percent_indicator: ^4.2.3
  syncfusion_flutter_charts: ^33.1.49
  upgrader: ^13.0.0
#  screenshot: ^2.1.0
  flutter_local_notifications: ^17.0.0
#  firebase_app_check: ^0.3.0
#  page_view_indicators: ^2.0.0
  rxdart: ^0.27.7
  photo_view: ^0.15.0
  connectivity_plus: ^6.0.5
  equatable: ^2.0.5
  # Live Order Tracking
  # live_activities: ^2.0.0
#  flutter_foreground_task: ^8.0.0
#  wakelock_plus: ^1.3.3
#  web_socket_channel: ^3.0.3
  package_info_plus: ^9.0.1

# ⚙️ حل تعارض win32 بين share_plus و package_info_plus.
# رغم إن التطبيق موبايل، Flutter بيعمل compile للكود الخاص بويندوز في الباكدجين دول
# أثناء عمل kernel snapshot. share_plus محتاج win32 5.x (بيستخدم OSVERSIONINFOEX.wReserved)
# و package_info_plus 10.x محتاج win32 6.x (الـ API اتغير). مفيش نسخة win32 واحدة ترضي الاتنين،
# فبنثبّت package_info_plus على 9.x (اللي بيستخدم win32 5.x زي share_plus) ونقفل win32 على 5.x.
dependency_overrides:
  win32: ^5.5.3

flutter_native_splash:
  color: "#081428"
  image: assets/images/icon.png

  android: true
  ios: true

  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#081428"
    image: assets/images/icon.png

