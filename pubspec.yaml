# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Keep CocoaPods for iOS plugins; SPM auto-migration conflicts with the
  # Live Activity widget target (duplicate Info.plist / project upgrades).
  config:
    enable-swift-package-manager: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svg/
    - assets/images/
    - assets/translations/
    - assets/images/icon.png
  fonts:
      - family: SF-Arabic
        fonts:
          - asset: assets/fonts/SF-Arabic.ttf
            weight: 400
          - asset: assets/fonts/SF-Arabic-Rounded.ttf
            weight: 500
      - family: GraphikArabic
        fonts:
#          - asset: assets/fonts/GraphikArabic-Thin.ttf
#            weight: 100
#          - asset: assets/fonts/GraphikArabic-ExtraLight.ttf
#            weight: 200
          - asset: assets/fonts/GraphikArabic-Light.ttf
            weight: 300
          - asset: assets/fonts/GraphikArabic-Regular.ttf
            weight: 400
          - asset: assets/fonts/GraphikArabic-Medium.ttf
            weight: 500
          - asset: assets/fonts/GraphikArabic-Semibold.ttf
            weight: 600
          - asset: assets/fonts/GraphikArabic-Bold.ttf
            weight: 700
          - asset: assets/fonts/GraphikArabic-ExtraBold.ttf
            weight: 800
          - asset: assets/fonts/GraphikArabic-Black.ttf
            weight: 900
      - family: LeagueSpartan
        fonts:
          - asset: assets/fonts/LeagueSpartan-Light.ttf
            weight: 100
          - asset: assets/fonts/LeagueSpartan-Regular.ttf
            weight: 200
          - asset: assets/fonts/LeagueSpartan-Medium.ttf
            weight: 300
          - asset: assets/fonts/LeagueSpartan-SemiBold.ttf
            weight: 400

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
