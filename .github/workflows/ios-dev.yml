# iOS DEV build on GitHub-hosted macOS (IPA artifact + optional TestFlight)
# Secrets required (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID          = 6SP3K86KWQ
#   APP_STORE_CONNECT_ISSUER_ID       = db04de63-863e-404d-8c33-c599ec8d27f1
#   APP_STORE_CONNECT_PRIVATE_KEY     = full contents of AuthKey_6SP3K86KWQ.p8
#   APPLE_TEAM_ID                     = Z8LQP638P4
#
# Optional for TestFlight upload:
#   APP_STORE_APPLE_ID                = numeric App Store Connect app id

name: iOS Dev (IPA + TestFlight)

on:
  workflow_dispatch:
  push:
    branches: [Des-v2]
    paths:
      - "ios/**"
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/ios-dev.yml"
      - "codemagic.yaml"

concurrency:
  group: ios-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS DEV
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple certificate tooling
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Codemagic CLI tools
        run: pip3 install codemagic-cli-tools --break-system-packages

      - name: Keychain + App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          keychain initialize
          app-store-connect fetch-signing-files com.DES.DESUserApp \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CONNECT_PRIVATE_KEY \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create
          app-store-connect fetch-signing-files com.DES.DESUserApp.widget \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CONNECT_PRIVATE_KEY \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: CocoaPods
        run: |
          cd ios
          pod install

      - name: Build IPA
        run: |
          BUILD_NUMBER=$(date +%s)
          flutter build ipa --release \
            --build-name=1.4.9 \
            --build-number="$BUILD_NUMBER"

      - name: Verify Widget Extension in IPA
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA=$IPA"
          unzip -l "$IPA" | grep -E 'appex|OrderTracking'
          unzip -l "$IPA" | grep -q OrderTrackingWidgetExtension.appex

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: des-ios-dev-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_ID" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @file:/tmp/AuthKey.p8 \
            --testflight
