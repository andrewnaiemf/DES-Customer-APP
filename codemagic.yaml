# DES Customer App — iOS DEV (TestFlight + IPA)
# workflowId: ios-dev
#
# Signing credentials are injected per-build (Codemagic API environment.variables):
#   APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_PRIVATE_KEY, CERTIFICATE_PRIVATE_KEY

workflows:
  ios-dev:
    name: iOS Dev (TestFlight + IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.DES.DESUserApp
        WIDGET_BUNDLE_ID: com.DES.DESUserApp.widget
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: Des-v2
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Set build number
        script: |
          set -e
          # Codemagic injects BUILD_NUMBER as its own counter (9, 10, ...).
          # That is LOWER than existing TestFlight builds (e.g. 44), so iPhones
          # never see the new IPA as an update. Always use a monotonic CFBundleVersion.
          IOS_BUILD_NUMBER="${IOS_BUILD_NUMBER:-$(($(date +%s)))}"
          # Keep marketing version aligned with what is already on TestFlight.
          IOS_BUILD_NAME="${IOS_BUILD_NAME:-1.4.8}"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER"
          echo "IOS_BUILD_NAME=$IOS_BUILD_NAME"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          echo "IOS_BUILD_NAME=$IOS_BUILD_NAME" >> "$CM_ENV"
          cd ios
          agvtool new-marketing-version "$IOS_BUILD_NAME" || true
          agvtool new-version -all "$IOS_BUILD_NUMBER" || true

      - name: Flutter pub get
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          set -e
          # Xcode 16+ projects may use objectVersion 70; ensure xcodeproj gem supports it.
          gem install xcodeproj -v 1.27.0 --user-install || true
          gem install cocoapods -v 1.16.2 --user-install || true
          cd ios
          # Fallback if gem still rejects objectVersion 70
          if grep -q "objectVersion = 70;" Runner.xcodeproj/project.pbxproj; then
            sed -i.bak 's/objectVersion = 70;/objectVersion = 56;/' Runner.xcodeproj/project.pbxproj
          fi
          pod install --verbose

      - name: Set up code signing with Codemagic
        script: |
          set -euo pipefail
          keychain initialize
          
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing KEY_IDENTIFIER}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing ISSUER_ID}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing PRIVATE_KEY}"
          
          echo "Fetching provisioning profiles and certificates..."
          
          # Fetch signing files for main app
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
          
          # Fetch signing files for widget
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY
          
          # Add certificates to keychain
          keychain add-certificates
          
          # Apply profiles
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          IOS_BUILD_NUMBER="${IOS_BUILD_NUMBER:-$(($(date +%s)))}"
          IOS_BUILD_NAME="${IOS_BUILD_NAME:-1.4.8}"
          
          # Use automatic signing
          flutter build ipa --release \
            --build-name="$IOS_BUILD_NAME" \
            --build-number="$IOS_BUILD_NUMBER"

      - name: Verify Widget Extension is embedded
        script: |
          set -e
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA=$IPA"
          unzip -l "$IPA" | grep -E 'appex|OrderTracking'
          unzip -l "$IPA" | grep -q OrderTrackingWidgetExtension.appex

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - andrewnaiemf@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
