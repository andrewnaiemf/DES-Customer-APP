# DES Customer App — iOS DEV (TestFlight + IPA)
# workflowId: ios-dev

workflows:
  ios-dev:
    name: iOS Dev (TestFlight + IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.DES.DESUserApp
      vars:
        BUNDLE_ID: com.DES.DESUserApp
        WIDGET_BUNDLE_ID: com.DES.DESUserApp.OrderTrackingWidget
        APP_STORE_CONNECT_KEY_IDENTIFIER: $APP_STORE_CONNECT_KEY_IDENTIFIER
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        CERTIFICATE_PRIVATE_KEY: $CERTIFICATE_PRIVATE_KEY

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: Des-v2
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Set build number
        script: |
          set -e
          BUILD_NUMBER="${BUILD_NUMBER:-$(($(date +%s)/60))}"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          cd ios
          agvtool new-version -all "$BUILD_NUMBER" || true

      - name: Flutter pub get
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch App Store signing files (app)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Fetch App Store signing files (Live Activity widget)
        script: |
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Apply provisioning profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          set -e
          BUILD_NUMBER="${BUILD_NUMBER:-$(($(date +%s)/60))}"
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number="$BUILD_NUMBER"

      - name: Verify Widget Extension is embedded
        script: |
          set -e
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA=$IPA"
          unzip -l "$IPA" | grep -E 'appex|OrderTracking'
          unzip -l "$IPA" | grep -q OrderTrackingWidgetExtension.appex

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - andrewnaiemf@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
